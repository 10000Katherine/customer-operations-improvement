<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 555" role="img" aria-labelledby="title desc"><title id="title">Business analysis deliverables: from objectives to traceable requirements</title><desc id="desc">Three epics, six user stories and three subtasks. Diagram represents the actual guided practice backlog; not a Jira screenshot or implementation result.</desc><rect width="1200" height="555" rx="20" fill="#f8fafc"/><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1200" height="108" rx="20" fill="#102a43"/><rect x="0" y="80" width="1200" height="28" fill="#102a43"/><text x="38" y="36" font-size="14" fill="#a9c9e9" font-weight="700" text-anchor="start">PORTFOLIO  /  REQUIREMENTS MANAGEMENT</text><text x="38" y="78" font-size="30" fill="#ffffff" font-weight="700" text-anchor="start">From analysis to traceable delivery requirements</text><text x="1160" y="36" font-size="14" fill="#a9c9e9" font-weight="700" text-anchor="end">02   /   BA DELIVERY</text><text x="38" y="137" font-size="14" fill="#475569" font-weight="700" text-anchor="start">CONFLUENCE BRD v1.0  →  JIRA EPICS  →  USER STORIES &amp; ACCEPTANCE CRITERIA</text><rect x="36" y="154" width="368" height="70" rx="10" fill="#246b92"/><text x="53" y="179" font-size="13" fill="#ffffff" font-weight="700" text-anchor="start">KAN-4  /  EPIC</text><text x="53" y="206" font-size="20" fill="#ffffff" font-weight="700" text-anchor="start">SLA monitoring</text><line x1="220" y1="224" x2="220" y2="242" stroke="#246b92" stroke-width="2"/><rect x="36" y="244" width="368" height="60" rx="8" fill="#e7f2f6"/><text x="51" y="266" font-size="13" fill="#246b92" font-weight="700" text-anchor="start">FR-01 · KAN-7</text><text x="51" y="288" font-size="18" fill="#102a43" font-weight="700" text-anchor="start">48-hour warning</text><rect x="36" y="312" width="368" height="60" rx="8" fill="#e7f2f6"/><text x="51" y="334" font-size="13" fill="#246b92" font-weight="700" text-anchor="start">FR-02 · KAN-8</text