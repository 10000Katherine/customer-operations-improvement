<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">Customer support operations: evidence and improvement focus</title><desc id="desc">4,000 synthetic tickets, 78.17% compliance at an assumed 72-hour resolution SLA. Technical and Integrations contribute 538 of 824 breaches, or 65.3%. Proposed 85% target, not an achieved result.</desc><rect width="1200" height="520" rx="20" fill="#f8fafc"/><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1200" height="112" rx="20" fill="#102a43"/><rect x="0" y="80" width="1200" height="32" fill="#102a43"/><text x="38" y="36" font-size="14" fill="#a9c9e9" font-weight="700" text-anchor="start">PORTFOLIO  /  CUSTOMER SUPPORT OPERATIONS</text><text x="38" y="80" font-size="31" fill="#ffffff" font-weight="700" text-anchor="start">Where should an SLA improvement pilot start?</text><text x="1160" y="36" font-size="14" fill="#a9c9e9" font-weight="700" text-anchor="end">01   /   ANALYSIS</text><rect x="36" y="138" width="368" height="104" rx="12" fill="#ffffff"/><text x="56" y="183" font-size="35" fill="#102a43" font-weight="700" text-anchor="start">4,000</text><text x="56" y="215" font-size="17" fill="#475569" font-weight="400" text-anchor="start">Synthetic tickets</text><rect x="416" y="138" width="368" height="104" rx="12" fill="#ffffff"/><text x="436" y="183" font-size="35" fill="#102a43" font-weight="700" text-anchor="start">78.17%</text><text x="436" y="215" font-size="17" fill="#475569" font-weight="400" text-anchor="start">Resolution SLA compliance</text><rect x="796" y="138" width="368" height="104" rx="12" fill="#ffffff"/><text x="816" y="183" font-size="35" fill="#102a43" font-weight="700" text-anchor="start">824</text><text x="816" y="215" font-size="17" fill="#475569" font-weight="400" text-anchor="start">Resolved-case SLA breaches</text><text x="38" y="282" font-size="23" fill="#102a43" font-weight="700" text-anchor="start">SLA breaches by queue</text><text x="38" y="308" font-size="15" fill="#475569" font-weight="400" text-anchor="start">Resolved tickets exceeding the assumed 72-hour threshold</text><text x="39" y="348" font-size="15" fill="#334155" font-weight="600" text-anchor="start">Technical</text><rect x="168" y="333" width="415" height="18" rx="4" fill="#246b92"/><text x="595" y="348" font-size="15" fill="#334155" font-weight="700" text-anchor="start">367</text><text x="39" y="376" font-size="15" fill="#334155" font-weight="600" text-anchor="start">Integrations</text><rect x="168" y="361" width="193" height="18" rx="4" fill="#3e97ae"/><text x="373" y="376" font-size="15" fill="#334155" font-weight="700" text-anchor="start">171</text><text x="39" y="404" font-size="15" fill="#334155" font-weight="600" text-anchor="start">Billing</text><rect x="168" y="389" width="139" height="18" rx="4" fill="#a9b9cb"/><text x="319" y="404" font-size="15" fill="#334155" font-weight="700" text-anchor="start">123</text><text x="39" y="432" font-size="15" fill="#334155" font-weight="600" text-anchor="start">Account</text><rect x="168" y="417" width="96" height="18" rx="4" fill="#a9b9cb"/><text x="276" y="432" font-size="15" fill="#334155" font-weight="700" text-anchor="start">85</text><text x="39" y="460" font-size="15" fill="#334155" font-weight="600" text-anchor="start">Onboarding</text><rect x="168" y="445" width="88" height="18" rx="4" fill="#a9b9cb"/><text x="268" y="460" font-size="15" fill="#334155" font-weight="700" text-anchor="start">78</text><rect x="687" y="265" width="477" height="218" rx="14" fill="#e7f2f6"/><text x="712" y="308" font-size="43" fill="#125675" font-weight="700" text-anchor="start">65.3%</text><text x="714" y="338" font-size="20" fill="#102a43" font-weight="700" text-anchor="start">Technical + Integrations</text><text x="714" y="365" font-size="18" fill="#334155" font-weight="400" text-anchor="start">538 of 824 breaches</text><line x1="714" y1="384" x2="1137" y2="384" stroke="#a8cbd7"/><text x="714" y="410" font-size="16" fill="#475569" font-weight="700" text-anchor="start">12-week proposed target</text><text x="714" y="450" font-size="30" fill="#125675" font-weight="700" text-anchor="start">78.17%  →  85%</text><text x="38" y="505" font-size="15" fill="#475569" font-weight="400" text-anchor="start">Synthetic data  •  Assumed SLA: 72 elapsed hours  •  Target and pilot are proposed, not implemented.</text></g></svg>